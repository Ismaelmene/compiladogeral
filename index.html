<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compilado de Prenhez</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#0f1a14;--card:#16251c;--line:#24382c;--txt:#e8f1ea;--mut:#8fa898;--ok:#4cc27a;--warn:#e0b341;--bad:#e06a5a;--blue:#4c9fe0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0}
main{max-width:1200px;margin:0 auto;padding:16px}
.btn{background:var(--ok);color:#062312;border:0;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}
.btn.sec{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:24px;margin-top:4px}
.kpi span{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.charts{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.chartbox{height:300px;position:relative}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
.scroll{max-height:420px;overflow:auto}
select,input[type=text],input[type=date],input[type=number],input[type=email],input[type=password]{background:#0c140f;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:14px;width:100%}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
.hide{display:none!important}
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;text-align:center;padding:20px}
.msg{color:var(--bad);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:#16452b;color:var(--ok)}.p-bad{background:#4a1f1a;color:var(--bad)}.p-mut{background:#222d26;color:var(--mut)}
.hist{display:flex;gap:8px;flex-wrap:wrap}
.hist button{font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:transparent;color:var(--txt);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ok);color:#062312;border-color:var(--ok);font-weight:700}
.fgrid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.note{color:var(--mut);font-size:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--txt)}
.chk input{width:auto}
</style>
</head>
<body>

<div id="login">
  <h1>Compilado de Prenhez</h1>
  <p style="color:var(--mut);margin:0">Acesso restrito</p>
  <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px">
    <input type="email" id="lgEmail" placeholder="E-mail" autocomplete="username">
    <input type="password" id="lgPass" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password">
    <button class="btn" id="btnEmailLogin">Entrar</button>
    <button class="btn sec" id="btnSignup">Criar conta (primeiro acesso)</button>
    <button class="btn sec" id="btnReset" style="border:0;font-size:12px;padding:4px">Esqueci a senha</button>
    <div style="color:var(--mut);font-size:12px">ou</div>
    <button class="btn sec" id="btnLogin">Entrar com Google</button>
  </div>
  <div class="msg" id="loginMsg" style="max-width:320px"></div>
</div>

<div id="app" class="hide">
<header>
  <h1>🐄 Compilado de Prenhez</h1>
  <div class="row">
    <input type="file" id="file" accept=".xlsx,.xls,.csv" class="hide">
    <button class="btn" id="btnImport">Importar planilha</button>
    <button class="btn sec" id="btnSave" disabled>Salvar no Firebase</button>
    <button class="btn sec" id="btnPdf" disabled>Gerar PDF (filtros atuais)</button>
    <button class="btn sec" id="btnPdfCat" disabled>PDF por categoria</button>
    <button class="btn sec" id="btnOut">Sair</button>
  </div>
</header>

<main>
  <div class="card" id="histCard">
    <b>Importações salvas</b>
    <div class="hist" id="hist" style="margin-top:10px"><span style="color:var(--mut)">Carregando…</span></div>
  </div>

  <div id="dash" class="hide">
    <div class="card" id="filters">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <b>Filtros</b>
        <div class="row">
          <span id="cnt" class="note"></span>
          <button class="btn sec" id="btnClear" style="padding:6px 12px">Limpar filtros</button>
        </div>
      </div>
      <label>Categorias (clique para escolher uma ou mais)</label>
      <div class="chips" id="chips"></div>
      <div class="grid fgrid" style="margin-top:14px">
        <div><label>Situação</label>
          <select id="fSit">
            <option value="">Todas</option>
            <option value="D">Diagnosticadas (prenhes + vazias)</option>
            <option value="P">Prenhes</option>
            <option value="I">Prenhes IATF</option>
            <option value="T">Prenhes Touro</option>
            <option value="V">Vazias</option>
            <option value="N">Sem diagnóstico</option>
          </select></div>
        <div><label>Fase da gestação</label>
          <select id="fFase">
            <option value="">Todas</option>
            <option value="P1">P1 (1 a 3 meses)</option>
            <option value="P2">P2 (4 a 6 meses)</option>
            <option value="P3">P3 (7 a 9 meses)</option>
          </select></div>
        <div><label>Local</label><select id="fLoc"></select></div>
        <div><label>Raça</label><select id="fRaca"></select></div>
        <div><label>Buscar brinco / ID</label><input type="text" id="fQ" placeholder="Ex.: 23P1212"></div>
      </div>
      <div style="margin-top:14px">
        <label class="chk"><input type="checkbox" id="pLista"> Incluir lista de animais no PDF</label>
      </div>
      <div class="note" style="margin-top:10px" id="srcName"></div>
    </div>

    <div class="grid kpis" id="kpis"></div>
    <div class="grid charts" style="margin-top:16px">
      <div class="card"><b>Diagnóstico gestacional</b><div class="chartbox"><canvas id="c1"></canvas></div></div>
      <div class="card"><b>Idade gestacional (meses)</b><div class="chartbox"><canvas id="c3"></canvas></div></div>
      <div class="card"><b>Prenhez por categoria</b><div class="chartbox"><canvas id="c4"></canvas></div></div>
      <div class="card"><b>Prenhez por local</b><div class="chartbox"><canvas id="c5"></canvas></div></div>
    </div>
    <div class="grid two">
      <div class="card"><b>Resumo por categoria</b><div class="scroll"><table id="tCat"></table></div></div>
      <div class="card"><b>Resumo por local</b><div class="scroll"><table id="tLoc"></table></div></div>
    </div>
    <div class="card"><b>Animais</b> <span class="note" id="tAniNote"></span>
      <div class="scroll"><table id="tAni"></table></div></div>
  </div>
</main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut,
  createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, writeBatch, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ====== CONFIG DO FIREBASE ======
const firebaseConfig = {
  apiKey: "AIzaSyCLkHlpAV-vu89HhuQFh12VUEuR7UdTkAw",
  authDomain: "compiladogeral-83eb2.firebaseapp.com",
  projectId: "compiladogeral-83eb2",
  storageBucket: "compiladogeral-83eb2.firebasestorage.app",
  messagingSenderId: "37859816615",
  appId: "1:37859816615:web:c3c37e787145e7e8841782"
};
const ALLOWED_EMAIL = "menezesapptec@gmail.com";
// ================================

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const title = s => String(s ?? "").trim().toLowerCase().replace(/(^|\s)\S/g, m => m.toUpperCase());
const fmt = d => d ? d.toLocaleDateString("pt-BR") : "";

let animais = [], fileName = "", charts = {};

// ---------- AUTH ----------
const msg = (t, ok=false) => { $("loginMsg").textContent = t; $("loginMsg").style.color = ok ? "var(--ok)" : "var(--bad)"; };
const authErr = e => ({
  "auth/invalid-credential":"E-mail ou senha incorretos.",
  "auth/wrong-password":"E-mail ou senha incorretos.",
  "auth/user-not-found":"E-mail ou senha incorretos.",
  "auth/email-already-in-use":"Este e-mail já tem conta. Entre com a senha, com o Google, ou use “Esqueci a senha”.",
  "auth/weak-password":"A senha precisa ter pelo menos 6 caracteres.",
  "auth/invalid-email":"E-mail inválido.",
  "auth/too-many-requests":"Muitas tentativas. Aguarde alguns minutos.",
  "auth/operation-not-allowed":"Ative o login por E-mail/Senha no Firebase (Authentication → Método de login)."
}[e.code] || ("Erro: " + e.message));
const creds = () => ({ email: $("lgEmail").value.trim().toLowerCase(), pass: $("lgPass").value });

$("btnLogin").onclick = async () => {
  msg("");
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e){ msg(authErr(e)); }
};
$("btnEmailLogin").onclick = async () => {
  msg("");
  const { email, pass } = creds();
  if (!email || !pass) return msg("Preencha e-mail e senha.");
  if (email !== ALLOWED_EMAIL) return msg("Este e-mail não tem acesso.");
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch(e){ msg(authErr(e)); }
};
$("btnSignup").onclick = async () => {
  msg("");
  const { email, pass } = creds();
  if (!email || !pass) return msg("Preencha e-mail e senha.");
  if (email !== ALLOWED_EMAIL) return msg("Este e-mail não tem acesso.");
  if (pass.length < 6) return msg("A senha precisa ter pelo menos 6 caracteres.");
  try { await createUserWithEmailAndPassword(auth, email, pass); }
  catch(e){ msg(authErr(e)); }
};
$("btnReset").onclick = async () => {
  msg("");
  const { email } = creds();
  if (email !== ALLOWED_EMAIL) return msg("Digite o e-mail de acesso no campo acima.");
  try { await sendPasswordResetEmail(auth, email); msg("Enviamos o link para redefinir a senha em " + email + ".", true); }
  catch(e){ msg(authErr(e)); }
};
$("btnOut").onclick = () => signOut(auth);

async function handleUser(u){
  if (u && u.email === ALLOWED_EMAIL) {
    $("login").classList.add("hide"); $("app").classList.remove("hide");
    loadHist();
  } else {
    if (u) { await signOut(auth); msg("Este e-mail não tem acesso."); }
    $("login").classList.remove("hide"); $("app").classList.add("hide");
  }
}
onAuthStateChanged(auth, handleUser);

// ---------- IMPORTAR (leitura automática) ----------
function parseIG(v){ const m = String(v ?? "").match(/^\s*(\d+)/); return m ? +m[1] : null; }
function parseSheet(aoa){
  const hi = aoa.findIndex(r => { const k = r.map(norm); return k.includes("categoria") && k.some(x => x === "dg" || x.startsWith("diagnost")); });
  if (hi < 0) throw new Error("Não reconheci a planilha: não achei a linha de cabeçalho com as colunas Categoria e DG.");
  const H = aoa[hi].map(norm);
  const col = (...n) => H.findIndex(h => n.includes(h));
  const cId = col("id"), cOld = col("id antigo","brinco"), cCat = col("categoria"), cRaca = col("raca"),
        cDg = col("dg","diagnostico gestacional","diagnostico"), cIg = col("idade gestacional"), cLoc = col("local","fazenda");
  const g = (r, c) => c >= 0 ? r[c] : "";
  const out = [];
  for (let i = hi + 1; i < aoa.length; i++){
    const r = aoa[i];
    if (String(g(r,cCat)).trim() === "") continue;
    const d = norm(g(r,cDg));
    const dg = d.includes("iatf") ? "IATF" : d.includes("touro") ? "Touro" : d.startsWith("vazi") ? "Vazia" : "";
    out.push({
      id: String(g(r,cId)).trim(),
      brinco: String(g(r,cOld)).trim(),
      cat: title(g(r,cCat)),
      raca: title(g(r,cRaca)) || "—",
      local: title(g(r,cLoc)) || "—",
      dg, pren: dg === "IATF" || dg === "Touro",
      ig: (dg === "IATF" || dg === "Touro") ? parseIG(g(r,cIg)) : null
    });
  }
  if (!out.length) throw new Error("Não encontrei animais na planilha.");
  return out;
}
$("btnImport").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const bt = $("btnImport"); bt.disabled = true; bt.textContent = "Lendo planilha…";
  try {
    await new Promise(r => setTimeout(r, 30));
    const wb = XLSX.read(await f.arrayBuffer());
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, defval:"", raw:true });
    fileName = f.name;
    showDash(parseSheet(aoa), fileName);
    $("btnSave").disabled = false; $("btnPdf").disabled = false; $("btnPdfCat").disabled = false;
  } catch(err){ alert(err.message || err); }
  bt.disabled = false; bt.textContent = "Importar planilha";
};

// ---------- FILTROS ----------
const faseDe = x => x <= 3 ? "P1" : x <= 6 ? "P2" : "P3";
const F = { cats:new Set(), sit:"", fase:"", loc:"", raca:"", q:"" };

function filtered(){
  const q = norm(F.q);
  return animais.filter(a => {
    if (F.cats.size && !F.cats.has(a.cat)) return false;
    switch (F.sit) {
      case "D": if (!a.dg) return false; break;
      case "P": if (!a.pren) return false; break;
      case "I": if (a.dg !== "IATF") return false; break;
      case "T": if (a.dg !== "Touro") return false; break;
      case "V": if (a.dg !== "Vazia") return false; break;
      case "N": if (a.dg) return false; break;
    }
    if (F.fase && (!a.pren || a.ig === null || faseDe(a.ig) !== F.fase)) return false;
    if (F.loc && a.local !== F.loc) return false;
    if (F.raca && a.raca !== F.raca) return false;
    if (q && !norm(a.brinco).includes(q) && a.id !== F.q.trim()) return false;
    return true;
  });
}
function filterText(){
  const p = [], sit = { D:"Diagnosticadas", P:"Prenhes", I:"Prenhes IATF", T:"Prenhes Touro", V:"Vazias", N:"Sem diagnóstico" };
  if (F.cats.size) p.push("Categorias: " + [...F.cats].join(", "));
  if (F.sit) p.push("Situação: " + sit[F.sit]);
  if (F.fase) p.push("Fase: " + F.fase);
  if (F.loc) p.push("Local: " + F.loc);
  if (F.raca) p.push("Raça: " + F.raca);
  if (F.q) p.push("Busca: " + F.q);
  return p.length ? "Filtros: " + p.join(" · ") : "Sem filtros (todos os animais)";
}
function buildChips(){
  const cats = [...new Set(animais.map(a=>a.cat))].sort();
  const box = $("chips"); box.innerHTML = "";
  const mk = (txt, on, fn) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip" + (on ? " on" : ""); b.textContent = txt; b.onclick = fn;
    box.appendChild(b);
  };
  mk("Todas", F.cats.size === 0, () => { F.cats.clear(); buildChips(); render(); });
  cats.forEach(c => {
    const n = animais.filter(a=>a.cat===c).length;
    mk(`${c} (${n})`, F.cats.has(c), () => { F.cats.has(c) ? F.cats.delete(c) : F.cats.add(c); buildChips(); render(); });
  });
}
function fillSelect(id, label, values){
  $(id).innerHTML = `<option value="">${label}</option>` + values.map(v => `<option>${esc(v)}</option>`).join("");
}
function resetFilters(){
  Object.assign(F, { cats:new Set(), sit:"", fase:"", loc:"", raca:"", q:"" });
  $("fSit").value = ""; $("fFase").value = ""; $("fQ").value = "";
  fillSelect("fLoc", "Todos", [...new Set(animais.map(a=>a.local))].sort());
  fillSelect("fRaca", "Todas", [...new Set(animais.map(a=>a.raca))].sort());
  buildChips();
}
[["fSit","sit"],["fFase","fase"],["fLoc","loc"],["fRaca","raca"],["fQ","q"]].forEach(([id,k]) => {
  $(id).addEventListener(id === "fQ" ? "input" : "change", e => { F[k] = e.target.value; render(); });
});
$("btnClear").onclick = () => { resetFilters(); render(); };

// ---------- DASHBOARD ----------
function showDash(list, name){
  animais = list;
  $("dash").classList.remove("hide");
  $("srcName").textContent = name ? "Origem: " + name : "";
  resetFilters(); render();
}
function stats(list){
  const diag = list.filter(a=>a.dg), pren = diag.filter(a=>a.pren);
  const iatf = pren.filter(a=>a.dg==="IATF").length, touro = pren.length - iatf;
  const igs = pren.filter(a=>a.ig!==null).map(a=>a.ig);
  const media = igs.length ? igs.reduce((s,x)=>s+x,0)/igs.length : 0;
  const fases = { P1:0, P2:0, P3:0 }, igHist = Array(9).fill(0);
  igs.forEach(x => { fases[faseDe(x)]++; if (x >= 1 && x <= 9) igHist[x-1]++; });
  const grp = key => { const m = {}; diag.forEach(a => { const k = a[key] || "—"; const o = m[k] || (m[k] = {i:0,t:0,v:0}); a.pren ? (a.dg==="IATF" ? o.i++ : o.t++) : o.v++; }); return m; };
  return { total:list.length, diag:diag.length, pren:pren.length, iatf, touro, vaz:diag.length-pren.length,
    taxa: diag.length ? pren.length/diag.length*100 : 0, media, fases, igHist,
    cat:grp("cat"), loc:grp("local") };
}
function stacked(map){
  const names = Object.keys(map).filter(k => map[k].i + map[k].t + map[k].v > 0).sort();
  return { labels:names, datasets:[
    { label:"Prenhe IATF",  data:names.map(n=>map[n].i), backgroundColor:"#4c9fe0" },
    { label:"Prenhe Touro", data:names.map(n=>map[n].t), backgroundColor:"#4cc27a" },
    { label:"Vazia",        data:names.map(n=>map[n].v), backgroundColor:"#e06a5a" } ] };
}
function makeChart(canvas, kind, s, base, plugins = []){
  const noLeg = { ...base, plugins:{ legend:{ display:false } } };
  const stk = { ...base, scales:{ x:{stacked:true}, y:{stacked:true} } };
  if (kind === "c1") return new Chart(canvas, { type:"doughnut", plugins, options:base,
    data:{ labels:["Prenhe IATF","Prenhe Touro","Vazia"], datasets:[{ data:[s.iatf,s.touro,s.vaz], backgroundColor:["#4c9fe0","#4cc27a","#e06a5a"] }] } });
  if (kind === "c3") return new Chart(canvas, { type:"bar", plugins, options:noLeg,
    data:{ labels:s.igHist.map((_,i)=>(i+1)+(i?" meses":" mês")), datasets:[{ label:"Vacas", data:s.igHist,
      backgroundColor:s.igHist.map((_,i)=> i<3 ? "#e0d041" : i<6 ? "#e0a341" : "#e06a41") }] } });
  if (kind === "c4") return new Chart(canvas, { type:"bar", plugins, options:stk, data:stacked(s.cat) });
  return new Chart(canvas, { type:"bar", plugins, options:stk, data:stacked(s.loc) });
}
function resumo(list, key){
  const m = {};
  list.forEach(a => { if (!a.dg) return; const k = a[key] || "—"; const o = m[k] || (m[k] = {d:0,i:0,t:0,v:0}); o.d++; a.pren ? (a.dg==="IATF" ? o.i++ : o.t++) : o.v++; });
  const row = (n,o) => [n, o.d, o.i+o.t, o.i, o.t, o.v, (o.d ? (o.i+o.t)/o.d*100 : 0).toFixed(1)+"%"];
  const rows = Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0])).map(([n,o])=>row(n,o));
  const tot = Object.values(m).reduce((s,o)=>({d:s.d+o.d,i:s.i+o.i,t:s.t+o.t,v:s.v+o.v}),{d:0,i:0,t:0,v:0});
  if (rows.length > 1) rows.push(row("Total", tot));
  return rows;
}
const RES_HEAD = ["","Diagnosticadas","Prenhes","IATF","Touro","Vazias","% Prenhez"];
const htmlTable = (head, rows) => "<tr>" + head.map(h=>`<th>${h}</th>`).join("") + "</tr>" +
  (rows.length ? rows.map(r=>"<tr>"+r.map(c=>`<td>${esc(c)}</td>`).join("")+"</tr>").join("") : `<tr><td colspan="${head.length}">Sem dados</td></tr>`);

function render(){
  const list = filtered(), s = stats(list);
  $("cnt").textContent = `Mostrando ${list.length} de ${animais.length} animais`;
  $("kpis").innerHTML = [
    ["Animais", s.total], ["Diagnosticadas", s.diag], ["Prenhes", s.pren], ["Vazias", s.vaz],
    ["Taxa de prenhez", s.taxa.toFixed(1)+"%"], ["Prenhe IATF", s.iatf], ["Prenhe Touro", s.touro],
    ["P1 · 1 a 3 meses", s.fases.P1], ["P2 · 4 a 6 meses", s.fases.P2], ["P3 · 7 a 9 meses", s.fases.P3],
    ["Gestação média", s.media.toFixed(1)+" meses"]
  ].map(([l,v])=>`<div class="kpi"><span>${l}</span><b>${v}</b></div>`).join("");

  Object.values(charts).forEach(c=>c.destroy()); charts = {};
  Chart.defaults.color = "#cfe0d4";
  const base = { responsive:true, maintainAspectRatio:false, animation:false };
  ["c1","c3","c4","c5"].forEach(k => charts[k] = makeChart($(k), k, s, base));

  $("tCat").innerHTML = htmlTable(["Categoria",...RES_HEAD.slice(1)], resumo(list,"cat"));
  $("tLoc").innerHTML = htmlTable(["Local",...RES_HEAD.slice(1)], resumo(list,"local"));

  const rank = a => a.pren ? 0 : a.dg ? 1 : 2;
  const sorted = [...list].sort((a,b) => rank(a)-rank(b) || (b.ig||0)-(a.ig||0));
  const LIM = 300;
  $("tAniNote").textContent = sorted.length > LIM ? `(mostrando ${LIM} de ${sorted.length}; use os filtros para refinar)` : "";
  const pill = a => a.dg === "Vazia" ? '<span class="pill p-bad">Vazia</span>' : a.pren ? `<span class="pill p-ok">Prenhe ${a.dg}</span>` : '<span class="pill p-mut">—</span>';
  $("tAni").innerHTML = "<tr><th>ID</th><th>Brinco</th><th>Categoria</th><th>Raça</th><th>Local</th><th>Diagnóstico</th><th>Gestação (meses)</th></tr>" +
    sorted.slice(0, LIM).map(a=>`<tr><td>${esc(a.id)}</td><td>${esc(a.brinco)}</td><td>${esc(a.cat)}</td><td>${esc(a.raca)}</td><td>${esc(a.local)}</td><td>${pill(a)}</td><td>${a.ig ?? ""}</td></tr>`).join("");
}

// ---------- FIREBASE ----------
// os animais são gravados em blocos de 500 por documento (poucas escritas, dentro da cota grátis)
const CHUNK = 500;
$("btnSave").onclick = async () => {
  if (!animais.length) return;
  $("btnSave").disabled = true; $("btnSave").textContent = "Salvando…";
  try {
    const s = stats(animais);
    const impRef = doc(collection(db, "importacoes"));
    const b = writeBatch(db);
    const n = Math.ceil(animais.length / CHUNK);
    b.set(impRef, { arquivo:fileName, criadoEm:serverTimestamp(), total:s.total, diagnosticadas:s.diag,
      prenhes:s.pren, vazias:s.vaz, lotes:n });
    for (let i = 0; i < n; i++) {
      const items = animais.slice(i*CHUNK, (i+1)*CHUNK).map(a => ({ i:a.id, b:a.brinco, c:a.cat, r:a.raca, l:a.local, d:a.dg, g:a.ig }));
      b.set(doc(impRef, "lotes", String(i).padStart(3,"0")), { animais:items });
    }
    await b.commit();
    alert("Salvo com sucesso.");
    loadHist();
  } catch(e){ alert("Erro ao salvar: " + e.message); }
  $("btnSave").textContent = "Salvar no Firebase"; $("btnSave").disabled = false;
};
async function loadHist(){
  try {
    const snap = await getDocs(query(collection(db,"importacoes"), orderBy("criadoEm","desc")));
    const h = $("hist"); h.innerHTML = "";
    if (snap.empty){ h.innerHTML = '<span style="color:var(--mut)">Nenhuma importação salva ainda.</span>'; return; }
    snap.forEach(d => {
      const x = d.data(), dt = x.criadoEm ? x.criadoEm.toDate().toLocaleDateString("pt-BR") : "";
      const bt = document.createElement("button"); bt.className = "btn sec";
      bt.textContent = `${x.arquivo || "Importação"} · ${dt} · ${x.total} animais`;
      bt.onclick = async () => {
        bt.disabled = true;
        try {
          const ls = await getDocs(collection(db,"importacoes",d.id,"lotes"));
          const docs = ls.docs.sort((a,b)=>a.id.localeCompare(b.id));
          const list = docs.flatMap(z => z.data().animais.map(a => ({
            id:a.i, brinco:a.b, cat:a.c, raca:a.r, local:a.l, dg:a.d, pren:a.d==="IATF"||a.d==="Touro", ig:a.g ?? null })));
          fileName = x.arquivo || "";
          showDash(list, fileName);
          $("btnPdf").disabled = false; $("btnPdfCat").disabled = false; $("btnSave").disabled = true;
        } catch(e){ alert("Erro ao abrir: " + e.message); }
        bt.disabled = false;
      };
      h.appendChild(bt);
    });
  } catch(e){ $("hist").innerHTML = '<span class="msg">Erro ao carregar: '+e.message+'</span>'; }
}

// ---------- PDF ----------
// gráficos desenhados fora da tela, com fundo branco, para qualquer lista de animais
function chartImgs(list, kinds, wide){
  const s = stats(list), out = {};
  const prev = Chart.defaults.color; Chart.defaults.color = "#222";
  const bg = { id:"bg", beforeDraw(c){ const x=c.ctx; x.save(); x.globalCompositeOperation="destination-over"; x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.restore(); } };
  kinds.forEach(k => {
    const cv = document.createElement("canvas");
    cv.width = k === wide ? 1320 : 640; cv.height = 420;
    const ch = makeChart(cv, k, s, { responsive:false, animation:false, devicePixelRatio:1 }, [bg]);
    out[k] = cv.toDataURL("image/png"); ch.destroy();
  });
  Chart.defaults.color = prev;
  return out;
}
const PDF_TITLES = { c1:"Diagnóstico gestacional", c3:"Idade gestacional (meses)", c4:"Prenhez por categoria", c5:"Prenhez por local" };
const GREEN = [30,110,70];

function kpiTables(pdf, y, s){
  pdf.autoTable({ startY:y, head:[["Animais","Diagnosticadas","Prenhes","Vazias","Taxa de prenhez","Gestação média"]],
    body:[[s.total, s.diag, s.pren, s.vaz, s.taxa.toFixed(1)+"%", s.media.toFixed(1)+" meses"]], headStyles:{ fillColor:GREEN } });
  pdf.autoTable({ startY:pdf.lastAutoTable.finalY + 3, head:[["Prenhe IATF","Prenhe Touro","P1 (1 a 3 meses)","P2 (4 a 6 meses)","P3 (7 a 9 meses)"]],
    body:[[s.iatf, s.touro, s.fases.P1, s.fases.P2, s.fases.P3]], headStyles:{ fillColor:GREEN } });
  return pdf.lastAutoTable.finalY;
}
function block(pdf, y, ttl, head, body, extra = {}){
  if (y > 255) { pdf.addPage(); y = 16; }
  pdf.setFontSize(12); pdf.setTextColor(0); pdf.text(ttl, 14, y);
  pdf.autoTable({ startY:y + 3, head:[head], body, headStyles:{ fillColor:GREEN }, ...extra });
  return pdf.lastAutoTable.finalY + 10;
}
function addSection(pdf, list, ttl, sub, kinds, first, wide, opts = {}){
  const s = stats(list), W = pdf.internal.pageSize.getWidth();
  if (!first) pdf.addPage();
  pdf.setFontSize(18); pdf.setTextColor(0); pdf.text(ttl, 14, 16);
  pdf.setFontSize(9); pdf.setTextColor(110);
  const lines = pdf.splitTextToSize(sub, W - 28); pdf.text(lines, 14, 22);
  pdf.setTextColor(0);
  const y = kpiTables(pdf, 22 + lines.length * 4 + 2, s) + 8;
  const imgs = chartImgs(list, kinds, wide);
  const w = (W - 28 - 6) / 2, h = 58;
  kinds.forEach((k,i) => {
    const full = k === wide;
    const cx = full ? 14 : 14 + (i % 2) * (w + 6);
    const cy = y + Math.floor(i / 2) * (h + 10);
    pdf.setFontSize(10); pdf.text(PDF_TITLES[k], cx, cy);
    pdf.addImage(imgs[k], "PNG", cx, cy + 2, full ? W - 28 : w, h);
  });
  pdf.addPage();
  let y2 = 16;
  if (opts.cat) y2 = block(pdf, y2, "Resumo por categoria", ["Categoria",...RES_HEAD.slice(1)], resumo(list,"cat"));
  y2 = block(pdf, y2, "Resumo por local", ["Local",...RES_HEAD.slice(1)], resumo(list,"local"));
  if (opts.lista) {
    const pr = list.filter(a=>a.pren).sort((a,b)=>(b.ig||0)-(a.ig||0));
    block(pdf, y2, "Animais prenhes — " + ttl, ["ID","Brinco","Categoria","Local","Diagnóstico","Gestação (meses)"],
      pr.map(a=>[a.id, a.brinco, a.cat, a.local, a.dg, a.ig ?? ""]), { styles:{ fontSize:8 } });
  }
}
function pageNumbers(pdf){
  const n = pdf.getNumberOfPages(), W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
  for (let i = 1; i <= n; i++){ pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(130); pdf.text(`Página ${i}/${n}`, W-14, H-8, { align:"right" }); }
}
const subtitle = () => `${fileName ? "Origem: " + fileName + " · " : ""}Gerado em ${new Date().toLocaleDateString("pt-BR")}\n${filterText()}`;
const ALL5 = ["c1","c3","c4","c5"];

$("btnPdf").onclick = () => {
  const list = filtered();
  if (!list.length) return alert("Nenhum animal nos filtros atuais.");
  const pdf = new window.jspdf.jsPDF({ unit:"mm", format:"a4" });
  addSection(pdf, list, "Compilado de Prenhez", subtitle(), ALL5, true, null, { cat:true, lista:$("pLista").checked });
  pageNumbers(pdf);
  pdf.save("compilado-prenhez.pdf");
};
$("btnPdfCat").onclick = () => {
  const list = filtered();
  if (!list.length) return alert("Nenhum animal nos filtros atuais.");
  const pdf = new window.jspdf.jsPDF({ unit:"mm", format:"a4" });
  const lista = $("pLista").checked;
  addSection(pdf, list, "Compilado Geral", subtitle(), ALL5, true, null, { cat:true, lista });
  // só categorias que têm diagnóstico gestacional (garrotes, bezerros etc. ficam de fora)
  const cats = [...new Set(list.filter(a=>a.dg).map(a=>a.cat))].sort();
  cats.forEach(c => addSection(pdf, list.filter(a=>a.cat===c), "Categoria: " + c, subtitle(), ["c1","c3","c5"], false, "c5", { lista }));
  pageNumbers(pdf);
  pdf.save("compilado-prenhez-por-categoria.pdf");
};
